version: 2

updates:
  - package-ecosystem: composer
    directory: /barberhub-api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Costa_Rica
    open-pull-requests-limit: 3
    labels:
      - dependencias
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /barberhub-web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Costa_Rica
    open-pull-requests-limit: 3
    labels:
      - dependencias
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Costa_Rica
    open-pull-requests-limit: 3
    labels:
      - dependencias
    commit-message:
      prefix: ci
