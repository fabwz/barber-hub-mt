; Pool of the production image (overrides www.conf).
[www]
; Without this PHP-FPM wipes the environment and Laravel would not see the variables that docker-compose.yml gives the container.
clear_env = no

pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
