; PHP settings of the production image (loaded after php.ini-production).
expose_php = Off
memory_limit = 256M
; Images of the barbershops are limited to 2 MB by the validation (SV-06); these leave room for the multipart overhead.
upload_max_filesize = 4M
post_max_size = 6M
date.timezone = America/Costa_Rica

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; The code of an image never changes, so PHP does not need to check the files.
opcache.validate_timestamps = 0
